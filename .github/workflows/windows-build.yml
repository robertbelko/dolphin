name: Windows build (FFNY speed branch)

on:
  push:
    branches: [ 'ffny-*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show tool versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          $v = (cl 2>&1 | Select-Object -First 1)
          Write-Host $v
          Write-Host "::notice::MSVC: $v"

      - name: Configure
        shell: pwsh
        run: cmake --preset ninja-release-x64 -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset ninja-build-release-x64 -- -k 0 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          # build logs are not readable from Claude's lab, annotations are
          if (Test-Path build.log) {
            $errs = Select-String -Path build.log -Pattern ': (fatal )?error |: warning C' | Select-Object -First 12
            foreach ($e in $errs) { $m = $e.Line; if ($m.Length -gt 900) { $m = $m.Substring(0,900) }; Write-Host "::error::$m" }
            $tail = (Get-Content build.log -Tail 6) -join ' | '
            if ($tail.Length -gt 900) { $tail = $tail.Substring($tail.Length-900) }
            Write-Host "::error::TAIL: $tail"
          }

      - name: Collect binaries
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter Dolphin.exe | Where-Object { $_.FullName -notmatch '\\Externals\\' } | Select-Object -First 1
          if (-not $exe) { Get-ChildItem -Recurse -Filter *.exe | Select-Object -First 50 FullName; throw "Dolphin.exe not found" }
          Write-Host "Found $($exe.FullName)"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "$($exe.DirectoryName)\*" out\
          "Built from $env:GITHUB_SHA on branch $env:GITHUB_REF_NAME" | Out-File out\build_info_ffny.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Dolphin-ffny-${{ github.sha }}
          path: out
          retention-days: 30
